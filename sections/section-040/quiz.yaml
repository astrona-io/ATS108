# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats108-040
course_id: ATS108
exam_code: PERSES
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "A Pipeline For Dashboards"
questions:
  - id: ats108-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what plain percli lint checks"
    source_readings:
      - sections/section-040/module-01/course-01-validating-dashboards.md
    prompt: "What does `percli lint -d built` check when you give it no other flags?"
    options:
      - id: a
        text: "Only that each file can be read as a Perses resource."
        explanation: "Correct. It has no plugin schemas, so a panel with an unknown plugin still passes."
      - id: b
        text: "Every plugin kind and field against the server's schemas."
        explanation: "Not correct. That needs `--online` or `--plugin.path`."
      - id: c
        text: "The custom lint rules of the server."
        explanation: "Not correct. The server's rules apply only with `--online`."
      - id: d
        text: "That the dashboards exist on the server."
        explanation: "Not correct. Lint does not talk to the server by default."
    correct_option: a
    explanation: "Correct. It has no plugin schemas, so a panel with an unknown plugin still passes."

  - id: ats108-040-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Lint against the server"
    source_readings:
      - sections/section-040/module-01/course-01-validating-dashboards.md
    prompt: "What does the flag `--online` change in `percli lint`?"
    options:
      - id: a
        text: "It applies the dashboards to the server."
        explanation: "Not correct. Lint never applies."
      - id: b
        text: "It downloads the plugin archives to your machine."
        explanation: "Not correct. `--plugin.path` uses local archives."
      - id: c
        text: "It lints the source files in the repository."
        explanation: "Not correct. Lint reads the built resources."
      - id: d
        text: "It sends each dashboard to the server's validation endpoint, which knows the plugins and applies its custom lint rules."
        explanation: "Correct. The server rejects what a plain lint accepts."
    correct_option: d
    explanation: "Correct. The server rejects what a plain lint accepts."

  - id: ats108-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Understand custom lint rules"
    source_readings:
      - sections/section-040/module-01/course-01-validating-dashboards.md
    prompt: "Which parts does a custom lint rule have?"
    options:
      - id: a
        text: "A `name`, a `query` (PromQL) and a `severity`."
        explanation: "Not correct. Rules target the dashboard JSON, not metrics."
      - id: b
        text: "A `file`, a `line` and a `fix`."
        explanation: "Not correct. Rules are not tied to source lines."
      - id: c
        text: "A `name`, a `target` (JSONPath), an `assertion` (CEL) and a `message`."
        explanation: "Correct. The server keeps the rules under `dashboard.custom_lint_rules`."
      - id: d
        text: "A `schema` (CUE) and an `owner`."
        explanation: "Not correct. Rules use JSONPath and CEL."
    correct_option: c
    explanation: "Correct. The server keeps the rules under `dashboard.custom_lint_rules`."

  - id: ats108-040-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the order of the pipeline"
    source_readings:
      - sections/section-040/module-01/course-02-pipeline-as-a-job.md
    prompt: "Which order do the steps of the pipeline script run in?"
    options:
      - id: a
        text: "Fetch, apply, build, lint, diff, dependencies."
        explanation: "Not correct. Nothing may be applied before the build and the lint."
      - id: b
        text: "Fetch, dependencies, build, lint, diff, apply."
        explanation: "Correct. The lint and the diff come before the apply."
      - id: c
        text: "Build, fetch, lint, apply, dependencies, diff."
        explanation: "Not correct. The code must be fetched first."
      - id: d
        text: "Dependencies, lint, build, diff, fetch, apply."
        explanation: "Not correct. The lint needs built files."
    correct_option: b
    explanation: "Correct. The lint and the diff come before the apply."

  - id: ats108-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain set -e"
    source_readings:
      - sections/section-040/module-01/course-02-pipeline-as-a-job.md
    prompt: "What does `set -e` change in the pipeline script?"
    options:
      - id: a
        text: "The shell stops at the first failing command, so a broken commit applies nothing."
        explanation: "Correct. Without it, the script would apply every dashboard except the broken one."
      - id: b
        text: "It makes the build skip files that fail."
        explanation: "Not correct. The build already continues with other files."
      - id: c
        text: "It retries a failed step once."
        explanation: "Not correct. It does not retry."
      - id: d
        text: "It stops the shell on an undefined variable."
        explanation: "Not correct. That is `set -u`."
    correct_option: a
    explanation: "Correct. Without it, the script would apply every dashboard except the broken one."

  - id: ats108-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know how the Job is started"
    source_readings:
      - sections/section-040/module-01/course-02-pipeline-as-a-job.md
    prompt: "How do you start a run of the pipeline in the playground?"
    options:
      - id: a
        text: "Wait for the schedule of the CronJob."
        explanation: "Not correct. It is suspended and never runs by itself."
      - id: b
        text: "Run `percli apply -d built` on your machine."
        explanation: "Not correct. That skips the pipeline steps."
      - id: c
        text: "Edit the ConfigMap, which starts a run."
        explanation: "Not correct. A changed ConfigMap starts nothing."
      - id: d
        text: "Create a Job from the suspended CronJob with `kubectl -n dac create job <name> --from=cronjob/dashboards-pipeline`."
        explanation: "Correct. The CronJob only serves as a template."
    correct_option: d
    explanation: "Correct. The CronJob only serves as a template."

  - id: ats108-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Avoid hiding failures"
    source_readings:
      - sections/section-040/module-01/course-02-pipeline-as-a-job.md
    prompt: "Why is `|| true` after the build step a problem?"
    options:
      - id: a
        text: "It makes the build run twice."
        explanation: "Not correct. It only changes the exit code."
      - id: b
        text: "It sends the log to a different pod."
        explanation: "Not correct. Logging is not affected."
      - id: c
        text: "The error is lost, and the run goes on to apply."
        explanation: "Correct. The pipeline can no longer stop at a broken build."
      - id: d
        text: "It turns off linting for that run."
        explanation: "Not correct. Lint is a separate step."
    correct_option: c
    explanation: "Correct. The pipeline can no longer stop at a broken build."

  - id: ats108-040-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Log in from a pipeline"
    source_readings:
      - sections/section-040/module-01/course-03-keeping-perses-and-git-the-same.md
    prompt: "Where do the credentials for `percli login` belong in the pipeline?"
    options:
      - id: a
        text: "Written in the script in the ConfigMap."
        explanation: "Not correct. Many people can read the ConfigMap."
      - id: b
        text: "In a Kubernetes Secret, passed to the Job's container as environment variables."
        explanation: "Correct. The script reads them from the environment."
      - id: c
        text: "Committed in the repository next to the dashboards."
        explanation: "Not correct. Secrets must not be in Git."
      - id: d
        text: "Typed by a person when the Job starts."
        explanation: "Not correct. A pipeline cannot type a password."
    correct_option: b
    explanation: "Correct. The script reads them from the environment."

  - id: ats108-040-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what apply does not do"
    source_readings:
      - sections/section-040/module-01/course-03-keeping-perses-and-git-the-same.md
    prompt: "You delete a dashboard file from Git and push. What happens to the dashboard on the server at the next pipeline run?"
    options:
      - id: a
        text: "It stays, because `percli apply` never deletes. Remove it on purpose with `percli delete dashboard`."
        explanation: "Correct. The pipeline only sees what is in `built`."
      - id: b
        text: "The pipeline deletes it, because it is missing from `built`."
        explanation: "Not correct. Missing files are not deleted."
      - id: c
        text: "The run fails, because the file is missing."
        explanation: "Not correct. The run succeeds."
      - id: d
        text: "The dashboard becomes read-only."
        explanation: "Not correct. Its state does not change."
    correct_option: a
    explanation: "Correct. The pipeline only sees what is in `built`."

  - id: ats108-040-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Limit edits outside the pipeline"
    source_readings:
      - sections/section-040/module-01/course-03-keeping-perses-and-git-the-same.md
    prompt: "Which two habits keep browser edits of code-managed dashboards rare?"
    options:
      - id: a
        text: "Give everyone administrator rights and review the logs monthly."
        explanation: "Not correct. Rights should be as small as possible."
      - id: b
        text: "Turn off the diff step and apply twice."
        explanation: "Not correct. The diff step shows where drift happened."
      - id: c
        text: "Delete the `built` folder after each run."
        explanation: "Not correct. That does not affect browser edits."
      - id: d
        text: "Give people read access only to those projects, and read the diff step in the pipeline log to find drift."
        explanation: "Correct. Only the pipeline's account needs edit rights."
    correct_option: d
    explanation: "Correct. Only the pipeline's account needs edit rights."

  - id: ats108-040-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the login options"
    source_readings:
      - sections/section-040/module-02/course-01-authenticating-the-pipeline.md
    prompt: "How can `percli login` authenticate to a server with authentication on?"
    options:
      - id: a
        text: "With the Kubernetes service account."
        explanation: "Not correct. The server does not read it."
      - id: b
        text: "With the Git password."
        explanation: "Not correct. Git credentials are separate."
      - id: c
        text: "It cannot authenticate."
        explanation: "Not correct. It can."
      - id: d
        text: "With a username and password, or with a token."
        explanation: "Correct. A pipeline normally uses a dedicated user or token."
    correct_option: d
    explanation: "Correct. A pipeline normally uses a dedicated user or token."

  - id: ats108-040-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Protect credentials"
    source_readings:
      - sections/section-040/module-02/course-01-authenticating-the-pipeline.md
    prompt: "Where should a pipeline's password come from?"
    options:
      - id: a
        text: "A Kubernetes Secret read into environment variables."
        explanation: "Correct. The Job reads the Secret with `valueFrom.secretKeyRef`."
      - id: b
        text: "The script in the ConfigMap."
        explanation: "Not correct. Everyone who reads the ConfigMap would see it."
      - id: c
        text: "The Git repository."
        explanation: "Not correct. It would be in the history."
      - id: d
        text: "The Job name."
        explanation: "Not correct. A name is not a secret."
    correct_option: a
    explanation: "Correct. The Job reads the Secret with `valueFrom.secretKeyRef`."

  - id: ats108-040-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Avoid leaking secrets in logs"
    source_readings:
      - sections/section-040/module-02/course-01-authenticating-the-pipeline.md
    prompt: "Why avoid `set -x` in a script that handles a password?"
    options:
      - id: a
        text: "It stops the script."
        explanation: "Not correct. It traces, it does not stop."
      - id: b
        text: "It prints every command with its values to the log."
        explanation: "Correct. A traced command shows the password in the Job log."
      - id: c
        text: "It disables `set -e`."
        explanation: "Not correct. They are separate options."
      - id: d
        text: "It slows `percli`."
        explanation: "Not correct. The issue is the log."
    correct_option: b
    explanation: "Correct. A traced command shows the password in the Job log."

  - id: ats108-040-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe check mode"
    source_readings:
      - sections/section-040/module-02/course-02-check-and-deploy-modes.md
    prompt: "What does a run with `MODE=check` do?"
    options:
      - id: a
        text: "It applies the dashboards twice."
        explanation: "Not correct. It applies nothing."
      - id: b
        text: "It skips the build."
        explanation: "Not correct. It builds and lints."
      - id: c
        text: "It runs the steps up to the diff and exits successfully before the apply."
        explanation: "Correct. The Job completes and the server stays unchanged."
      - id: d
        text: "It deletes the dashboards."
        explanation: "Not correct. It changes nothing."
    correct_option: c
    explanation: "Correct. The Job completes and the server stays unchanged."

  - id: ats108-040-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a default value"
    source_readings:
      - sections/section-040/module-02/course-02-check-and-deploy-modes.md
    prompt: "Why does the script use `${MODE:-deploy}`?"
    options:
      - id: a
        text: "It exports the variable."
        explanation: "Not correct. It reads the value."
      - id: b
        text: "It requires a value."
        explanation: "Not correct. It supplies a default."
      - id: c
        text: "It runs the apply twice."
        explanation: "Not correct. It does not."
      - id: d
        text: "With `set -u`, an unset variable stops the script; the default makes it deploy."
        explanation: "Correct. The expression is the value of MODE, or `deploy` when MODE is not set."
    correct_option: d
    explanation: "Correct. The expression is the value of MODE, or `deploy` when MODE is not set."

  - id: ats108-040-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Scope the variable"
    source_readings:
      - sections/section-040/module-02/course-02-check-and-deploy-modes.md
    prompt: "Where should `MODE=check` be set for a check run?"
    options:
      - id: a
        text: "On one Job created from the CronJob."
        explanation: "Correct. The CronJob stays without the variable so default runs deploy."
      - id: b
        text: "In the CronJob."
        explanation: "Not correct. Every run would be a check run."
      - id: c
        text: "In the repository."
        explanation: "Not correct. It is runtime configuration."
      - id: d
        text: "In Perses."
        explanation: "Not correct. The server does not run the script."
    correct_option: a
    explanation: "Correct. The CronJob stays without the variable so default runs deploy."

  - id: ats108-040-q17
    type: single_choice
    difficulty: advanced
    learning_objective: "Fail a bad commit in check mode"
    source_readings:
      - sections/section-040/module-02/course-02-check-and-deploy-modes.md
    prompt: "What happens to a check run on a commit with a broken dashboard?"
    options:
      - id: a
        text: "It completes, because check mode ignores errors."
        explanation: "Not correct. Check mode only skips the apply."
      - id: b
        text: "It fails, because build and lint run with `set -e` before the exit."
        explanation: "Correct. The author sees the same error on a branch as on main."
      - id: c
        text: "It applies the other dashboards."
        explanation: "Not correct. Nothing is applied."
      - id: d
        text: "It waits for the next commit."
        explanation: "Not correct. The Job ends."
    correct_option: b
    explanation: "Correct. The author sees the same error on a branch as on main."

  - id: ats108-040-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Align versions"
    source_readings:
      - sections/section-040/module-02/course-03-keeping-versions-aligned.md
    prompt: "Which tools use the same release number in this course?"
    options:
      - id: a
        text: "Only `percli` and Go."
        explanation: "Not correct. The server and SDK modules match too."
      - id: b
        text: "Every plugin and the server."
        explanation: "Not correct. Plugins have their own versions."
      - id: c
        text: "`percli`, the Perses server and the Perses SDK modules."
        explanation: "Correct. A mismatch shows up as a rejected field or a plugin that fails to load."
      - id: d
        text: "None of them."
        explanation: "Not correct. They must agree."
    correct_option: c
    explanation: "Correct. A mismatch shows up as a rejected field or a plugin that fails to load."

  - id: ats108-040-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Verify through the API"
    source_readings:
      - sections/section-040/module-02/course-04-verifying-after-apply.md
    prompt: "What does a green pipeline run prove?"
    options:
      - id: a
        text: "That the server equals the build."
        explanation: "Not correct. That needs a check."
      - id: b
        text: "That the dashboards are correct."
        explanation: "Not correct. Correctness is separate."
      - id: c
        text: "That nobody edited the browser."
        explanation: "Not correct. Drift is separate."
      - id: d
        text: "That every command exited with code 0, not that the server matches the code."
        explanation: "Correct. Use the API list and `percli dac diff` after the apply to verify."
    correct_option: d
    explanation: "Correct. Use the API list and `percli dac diff` after the apply to verify."

  - id: ats108-040-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Add a verify step"
    source_readings:
      - sections/section-040/module-02/course-04-verifying-after-apply.md
    prompt: "Where does a verify step with `percli dac diff` belong?"
    options:
      - id: a
        text: "After `percli apply`, so the run succeeds only if the server equals the build."
        explanation: "Correct. The diff after the apply turns the pipeline into its own verifier."
      - id: b
        text: "Before the build."
        explanation: "Not correct. The built folder would be old."
      - id: c
        text: "Instead of the lint."
        explanation: "Not correct. The lint checks resources."
      - id: d
        text: "In the CronJob schedule."
        explanation: "Not correct. The schedule only sets timing."
    correct_option: a
    explanation: "Correct. The diff after the apply turns the pipeline into its own verifier."

