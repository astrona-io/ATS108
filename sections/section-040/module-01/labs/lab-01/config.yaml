# Make The Pipeline Refuse Broken Dashboards
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-108-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-perses"
      description: "Installs Helm, Perses v0.54.0, Prometheus, Gitea and the DaC runner"
      type: "file"
      source: "bootstrap/01-install-perses.sh"
    - name: "ats-108-lab-040-01-setup"
      description: "Pushes the starting state of gitops/dashboards and prepares the task"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus, the tester pod, Gitea and the DaC runner."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-perses"
      description: "Waits until Perses, Gitea and the DaC runner answer"
      type: "file"
      source: "testing/wait-for-perses.sh"
    - name: "reference-solution"
      description: "The work a correct learner does; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-online-lint"
      description: "Confirms the pipeline lints the built dashboards against the server"
      type: "file"
      source: "validation/validate-online-lint.sh"
    - name: "validate-broken-commit-applies-nothing"
      description: "Pushes a broken commit and confirms the run fails and applies nothing"
      type: "file"
      source: "validation/validate-broken-commit-applies-nothing.sh"
    - name: "validate-good-commit-applies"
      description: "Fixes the commit and confirms the run succeeds and applies everything"
      type: "file"
      source: "validation/validate-good-commit-applies.sh"

teardown:
  keepCluster: false
