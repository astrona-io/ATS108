# Final domain knowledge check across all four sections.
schema_version: 1
kind: question_bank
id: ats108-final
course_id: ATS108
exam_code: PERSES
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: dashboard-as-code
  title: "Dashboard-as-Code With CUE & Go"
questions:
  - id: ats108-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what Perses stores for a dashboard"
    source_readings:
      - sections/section-010/module-01/course-01-dashboards-as-code.md
    prompt: "In what form does a Perses server store a dashboard?"
    options:
      - id: a
        text: "As a binary file that only the Perses user interface can write."
        explanation: "Not correct. The stored object is JSON, and a text file can produce it."
      - id: b
        text: "As a Git commit in the Perses server's own repository."
        explanation: "Not correct. Perses does not keep dashboards in Git by itself."
      - id: c
        text: "As a resource: a JSON object with a `kind`, a `metadata` block and a `spec`."
        explanation: "Correct. The `spec` holds panels, layouts, queries and variables."
      - id: d
        text: "As a CUE package that the server evaluates on every request."
        explanation: "Not correct. The server stores JSON, not CUE."
    correct_option: c
    explanation: "Correct. The `spec` holds panels, layouts, queries and variables."

  - id: ats108-final-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what percli dac build runs for a CUE file"
    source_readings:
      - sections/section-010/module-01/course-01-dashboards-as-code.md
    prompt: "What does `percli dac build` run for a `.cue` dashboard file?"
    options:
      - id: a
        text: "`go run <file> --output json`"
        explanation: "Not correct. That command is what the build runs for a Go file."
      - id: b
        text: "`kubectl apply -f <file>`"
        explanation: "Not correct. The build does not talk to the cluster."
      - id: c
        text: "`cue vet <file>` without any output"
        explanation: "Not correct. The build needs the JSON output, so it uses `cue eval`."
      - id: d
        text: "`cue eval <file> --out json --concrete`"
        explanation: "Correct. The `--concrete` flag fails the build if a value is still undecided."
    correct_option: d
    explanation: "Correct. The `--concrete` flag fails the build if a value is still undecided."

  - id: ats108-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Define drift and find it"
    source_readings:
      - sections/section-010/module-01/course-03-applying-and-diffing.md
    prompt: "Which command shows drift between the code and the server, and what does it compare?"
    options:
      - id: a
        text: "`percli dac diff` compares the `spec` of each built dashboard with the dashboard of the same name on the server."
        explanation: "Correct. Any line in the diff is a difference between the code and the server."
      - id: b
        text: "`percli get dashboards` compares the list of names only."
        explanation: "Not correct. It lists dashboards and shows no differences."
      - id: c
        text: "`percli apply --dry-run` compares the Git history with the server."
        explanation: "Not correct. The diff command compares built files with the server."
      - id: d
        text: "`percli dac build -m stdout` compares two builds with each other."
        explanation: "Not correct. That flag only prints the built dashboard."
    correct_option: a
    explanation: "Correct. Any line in the diff is a difference between the code and the server."

  - id: ats108-final-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain unification"
    source_readings:
      - sections/section-020/module-01/course-01-cue-essentials.md
    prompt: "Two lines in one CUE value set `height: 8` and `height: 12`. What happens?"
    options:
      - id: a
        text: "The second value replaces the first, so the height is 12."
        explanation: "Not correct. CUE never overwrites."
      - id: b
        text: "CUE reports a conflict, because it unifies values and does not overwrite."
        explanation: "Correct. Unification keeps only what both values allow, and 8 and 12 allow no common value."
      - id: c
        text: "The first value wins, so the height is 8."
        explanation: "Not correct. Order does not decide. Both must agree."
      - id: d
        text: "CUE picks the larger number."
        explanation: "Not correct. CUE has no such rule."
    correct_option: b
    explanation: "Correct. Unification keeps only what both values allow, and 8 and 12 allow no common value."

  - id: ats108-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read panel keys"
    source_readings:
      - sections/section-020/module-01/course-02-perses-cue-builders.md
    prompt: "In a built dashboard, which key does the first panel of the second panel group get?"
    options:
      - id: a
        text: "`0_1`, because groups count from the second item."
        explanation: "Not correct. The group position comes first, and the second group is position 1."
      - id: b
        text: "`panel-2`, taken from the panel title."
        explanation: "Not correct. Keys follow positions, not names."
      - id: c
        text: "`1_0`, made of the group's position and the panel's position."
        explanation: "Correct. Moving a panel changes its key."
      - id: d
        text: "`2_0`, because counting starts at one."
        explanation: "Not correct. Positions start at zero."
    correct_option: c
    explanation: "Correct. Moving a panel changes its key."

  - id: ats108-final-q06
    type: single_choice
    difficulty: advanced
    learning_objective: "Fix a schema error at its source"
    source_readings:
      - sections/section-020/module-01/course-03-shared-definitions-and-validation.md
    prompt: "A library change to `\"average\"` makes the build of every dashboard fail on `calculation`. What is the right fix?"
    options:
      - id: a
        text: "Loosen the plugin schema so that `\"average\"` is allowed."
        explanation: "Not correct. Never weaken the schema to fit a wrong value."
      - id: b
        text: "Build the dashboards one by one until one passes."
        explanation: "Not correct. Every dashboard that uses the panel fails the same way."
      - id: c
        text: "Remove `--concrete` from the build."
        explanation: "Not correct. The value is wrong, not incomplete."
      - id: d
        text: "Change the value back to one the Stat chart accepts, such as `\"last\"`."
        explanation: "Correct. The error is in the value. The schema is right."
    correct_option: d
    explanation: "Correct. The error is in the value. The schema is right."

  - id: ats108-final-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain how a Go dashboard runs"
    source_readings:
      - sections/section-030/module-01/course-01-go-module-and-exec.md
    prompt: "How does `percli dac build` turn a Go dashboard into JSON?"
    options:
      - id: a
        text: "It runs `go run <file> --output <format>` from the file's folder and takes standard output as the dashboard."
        explanation: "Correct. The program prints the dashboard."
      - id: b
        text: "It compiles the file into a library that Perses loads."
        explanation: "Not correct. A Go dashboard is a program that runs once."
      - id: c
        text: "It calls `cue eval` on the Go file."
        explanation: "Not correct. `cue eval` is for CUE files."
      - id: d
        text: "It sends the Go file to the Perses server to run."
        explanation: "Not correct. The build runs locally."
    correct_option: a
    explanation: "Correct. The program prints the dashboard."

  - id: ats108-final-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell the two names apart"
    source_readings:
      - sections/section-030/module-01/course-02-go-builders.md
    prompt: "In `dashboard.New(\"perses-requests\", dashboard.Name(\"Perses Requests\"))`, what does `dashboard.Name` set?"
    options:
      - id: a
        text: "The identifier `metadata.name`."
        explanation: "Not correct. The first argument of `dashboard.New` sets that."
      - id: b
        text: "The title shown in the browser. The first argument is the identifier `metadata.name`."
        explanation: "Correct. The two are different fields."
      - id: c
        text: "The Git branch of the dashboard."
        explanation: "Not correct. Branches are not part of the resource."
      - id: d
        text: "The name of the output file."
        explanation: "Not correct. The output file follows the source path."
    correct_option: b
    explanation: "Correct. The two are different fields."

  - id: ats108-final-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Place tests correctly"
    source_readings:
      - sections/section-030/module-01/course-03-functions-and-tests.md
    prompt: "Where must Go tests for dashboard logic live?"
    options:
      - id: a
        text: "Next to each `main.go` as `main_test.go`."
        explanation: "Not correct. `percli dac build -d` then fails on that file."
      - id: b
        text: "In the `built` folder."
        explanation: "Not correct. `built` holds results of the build."
      - id: c
        text: "In a library package such as `lib/boards`, outside `dashboards`."
        explanation: "Correct. A `_test.go` file in package `main` under `dashboards` is passed to `go run`, which refuses it."
      - id: d
        text: "Tests are not possible for dashboards."
        explanation: "Not correct. Library functions can be tested with `go test`."
    correct_option: c
    explanation: "Correct. A `_test.go` file in package `main` under `dashboards` is passed to `go run`, which refuses it."

  - id: ats108-final-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what plain percli lint checks"
    source_readings:
      - sections/section-040/module-01/course-01-validating-dashboards.md
    prompt: "What does `percli lint -d built` check when you give it no other flags?"
    options:
      - id: a
        text: "Every plugin kind and field against the server's schemas."
        explanation: "Not correct. That needs `--online` or `--plugin.path`."
      - id: b
        text: "The custom lint rules of the server."
        explanation: "Not correct. The server's rules apply only with `--online`."
      - id: c
        text: "That the dashboards exist on the server."
        explanation: "Not correct. Lint does not talk to the server by default."
      - id: d
        text: "Only that each file can be read as a Perses resource."
        explanation: "Correct. It has no plugin schemas, so a panel with an unknown plugin still passes."
    correct_option: d
    explanation: "Correct. It has no plugin schemas, so a panel with an unknown plugin still passes."

  - id: ats108-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain set -e"
    source_readings:
      - sections/section-040/module-01/course-02-pipeline-as-a-job.md
    prompt: "What does `set -e` change in the pipeline script?"
    options:
      - id: a
        text: "The shell stops at the first failing command, so a broken commit applies nothing."
        explanation: "Correct. Without it, the script would apply every dashboard except the broken one."
      - id: b
        text: "It makes the build skip files that fail."
        explanation: "Not correct. The build already continues with other files."
      - id: c
        text: "It retries a failed step once."
        explanation: "Not correct. It does not retry."
      - id: d
        text: "It stops the shell on an undefined variable."
        explanation: "Not correct. That is `set -u`."
    correct_option: a
    explanation: "Correct. Without it, the script would apply every dashboard except the broken one."

  - id: ats108-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what apply does not do"
    source_readings:
      - sections/section-040/module-01/course-03-keeping-perses-and-git-the-same.md
    prompt: "You delete a dashboard file from Git and push. What happens to the dashboard on the server at the next pipeline run?"
    options:
      - id: a
        text: "The pipeline deletes it, because it is missing from `built`."
        explanation: "Not correct. Missing files are not deleted."
      - id: b
        text: "It stays, because `percli apply` never deletes. Remove it on purpose with `percli delete dashboard`."
        explanation: "Correct. The pipeline only sees what is in `built`."
      - id: c
        text: "The run fails, because the file is missing."
        explanation: "Not correct. The run succeeds."
      - id: d
        text: "The dashboard becomes read-only."
        explanation: "Not correct. Its state does not change."
    correct_option: b
    explanation: "Correct. The pipeline only sees what is in `built`."

  - id: ats108-final-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the output path"
    source_readings:
      - sections/section-010/module-02/course-03-controlling-the-build.md
    prompt: "Where does the build write the result of `dashboards/cue/prometheus-overview.cue` in JSON?"
    options:
      - id: a
        text: "`dashboards/cue/prometheus-overview.json`"
        explanation: "Not correct. The result goes to the `built` folder."
      - id: b
        text: "`built/dashboards/cue/prometheus-overview_output.json`"
        explanation: "Correct. The output path is the source path without its extension, placed in `built` with the suffix `_output` and the format."
      - id: c
        text: "`built/prometheus-overview.json`"
        explanation: "Not correct. The path keeps the source folders."
      - id: d
        text: "Standard output only."
        explanation: "Not correct. That happens only with `-m stdout`."
    correct_option: b
    explanation: "Correct. The output path is the source path without its extension, placed in `built` with the suffix `_output` and the format."

  - id: ats108-final-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Handle a project mismatch"
    source_readings:
      - sections/section-010/module-02/course-04-projects-and-apply.md
    prompt: "A dashboard names a project that does not exist. What is the correct fix for a dashboard that belongs in `inventory`?"
    options:
      - id: a
        text: "Apply with `--force`."
        explanation: "Not correct. The source would still name the wrong project."
      - id: b
        text: "Create the missing project with `--create-project`."
        explanation: "Not correct. That makes the wrong project permanent."
      - id: c
        text: "Change the project in the source, commit, build and apply."
        explanation: "Correct. The fix belongs in the code, so the next build and apply produce the right result."
      - id: d
        text: "Edit the dashboard in the browser."
        explanation: "Not correct. The code would then differ from the server."
    correct_option: c
    explanation: "Correct. The fix belongs in the code, so the next build and apply produce the right result."

  - id: ats108-final-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Chain variables"
    source_readings:
      - sections/section-020/module-02/course-02-chained-variables.md
    prompt: "How does the variable group builder pass earlier variables to a later one?"
    options:
      - id: a
        text: "By name, in any order."
        explanation: "Not correct. Order decides."
      - id: b
        text: "It passes all variables to all variables."
        explanation: "Not correct. Only earlier ones."
      - id: c
        text: "It does not chain variables."
        explanation: "Not correct. It does."
      - id: d
        text: "In list order: each variable receives the ones listed before it."
        explanation: "Correct. A later variable uses the earlier ones as filters in its matchers."
    correct_option: d
    explanation: "Correct. A later variable uses the earlier ones as filters in its matchers."

  - id: ats108-final-q16
    type: single_choice
    difficulty: advanced
    learning_objective: "Generate groups"
    source_readings:
      - sections/section-020/module-02/course-03-generating-panel-groups.md
    prompt: "How do you make a panel group for each job in `_jobs`?"
    options:
      - id: a
        text: "Use a `for` comprehension that yields one group struct per job."
        explanation: "Correct. The comprehension turns a data change into a structure change."
      - id: b
        text: "Copy the group block for each job."
        explanation: "Not correct. That repeats code."
      - id: c
        text: "Add each job to `#title`."
        explanation: "Not correct. A title is one string."
      - id: d
        text: "Use `cue fmt`."
        explanation: "Not correct. Formatting does not generate."
    correct_option: a
    explanation: "Correct. The comprehension turns a data change into a structure change."

  - id: ats108-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pass a slice of options"
    source_readings:
      - sections/section-030/module-02/course-02-data-driven-dashboards.md
    prompt: "How do you pass a slice named `options` to `dashboard.New`?"
    options:
      - id: a
        text: "`dashboard.New(\"name\", options)`"
        explanation: "Not correct. Go rejects a slice as a single option."
      - id: b
        text: "`dashboard.New(\"name\", options...)`"
        explanation: "Correct. The three dots expand the slice into separate arguments."
      - id: c
        text: "`dashboard.New(options)`"
        explanation: "Not correct. The name comes first."
      - id: d
        text: "`dashboard.New(\"name\", &options)`"
        explanation: "Not correct. A pointer is not a list of options."
    correct_option: b
    explanation: "Correct. The three dots expand the slice into separate arguments."

  - id: ats108-final-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the counts in a test"
    source_readings:
      - sections/section-030/module-02/course-03-testing-dashboard-functions.md
    prompt: "Where does a test read the number of panels of a built dashboard?"
    options:
      - id: a
        text: "`builder.Panels`"
        explanation: "Not correct. The dashboard is in the field `Dashboard`."
      - id: b
        text: "The `built` folder."
        explanation: "Not correct. Tests do not build files."
      - id: c
        text: "`builder.Dashboard.Spec.Panels`"
        explanation: "Correct. The builder holds the finished dashboard after `dashboard.New` succeeds."
      - id: d
        text: "The server API."
        explanation: "Not correct. Tests run without a server."
    correct_option: c
    explanation: "Correct. The builder holds the finished dashboard after `dashboard.New` succeeds."

  - id: ats108-final-q19
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe check mode"
    source_readings:
      - sections/section-040/module-02/course-02-check-and-deploy-modes.md
    prompt: "What does a run with `MODE=check` do?"
    options:
      - id: a
        text: "It applies the dashboards twice."
        explanation: "Not correct. It applies nothing."
      - id: b
        text: "It skips the build."
        explanation: "Not correct. It builds and lints."
      - id: c
        text: "It deletes the dashboards."
        explanation: "Not correct. It changes nothing."
      - id: d
        text: "It runs the steps up to the diff and exits successfully before the apply."
        explanation: "Correct. The Job completes and the server stays unchanged."
    correct_option: d
    explanation: "Correct. The Job completes and the server stays unchanged."

  - id: ats108-final-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Verify through the API"
    source_readings:
      - sections/section-040/module-02/course-04-verifying-after-apply.md
    prompt: "What does a green pipeline run prove?"
    options:
      - id: a
        text: "That every command exited with code 0, not that the server matches the code."
        explanation: "Correct. Use the API list and `percli dac diff` after the apply to verify."
      - id: b
        text: "That the server equals the build."
        explanation: "Not correct. That needs a check."
      - id: c
        text: "That the dashboards are correct."
        explanation: "Not correct. Correctness is separate."
      - id: d
        text: "That nobody edited the browser."
        explanation: "Not correct. Drift is separate."
    correct_option: a
    explanation: "Correct. Use the API list and `percli dac diff` after the apply to verify."

