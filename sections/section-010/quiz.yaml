# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats108-010
course_id: ATS108
exam_code: PERSES
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Why Dashboard-As-Code"
questions:
  - id: ats108-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what Perses stores for a dashboard"
    source_readings:
      - sections/section-010/module-01/course-01-dashboards-as-code.md
    prompt: "In what form does a Perses server store a dashboard?"
    options:
      - id: a
        text: "As a binary file that only the Perses user interface can write."
        explanation: "Not correct. The stored object is JSON, and a text file can produce it."
      - id: b
        text: "As a resource: a JSON object with a `kind`, a `metadata` block and a `spec`."
        explanation: "Correct. The `spec` holds panels, layouts, queries and variables."
      - id: c
        text: "As a Git commit in the Perses server's own repository."
        explanation: "Not correct. Perses does not keep dashboards in Git by itself."
      - id: d
        text: "As a CUE package that the server evaluates on every request."
        explanation: "Not correct. The server stores JSON, not CUE."
    correct_option: b
    explanation: "Correct. The `spec` holds panels, layouts, queries and variables."

  - id: ats108-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what Git gives a dashboard"
    source_readings:
      - sections/section-010/module-01/course-01-dashboards-as-code.md
    prompt: "Which problem does keeping the dashboard source in Git solve?"
    options:
      - id: a
        text: "Each change has an author, a message and a diff, and the previous commit still builds the previous dashboard."
        explanation: "Correct. Git gives history, review and a way back."
      - id: b
        text: "Perses can then no longer be edited in the browser by anyone."
        explanation: "Not correct. Git does not block browser edits. The next apply only overwrites them."
      - id: c
        text: "The dashboard JSON becomes smaller and loads faster."
        explanation: "Not correct. Git does not change the size or speed of the dashboard."
      - id: d
        text: "Queries are checked against live data before each commit."
        explanation: "Not correct. Git does not run queries."
    correct_option: a
    explanation: "Correct. Git gives history, review and a way back."

  - id: ats108-010-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Compare the CUE and Go SDKs"
    source_readings:
      - sections/section-010/module-01/course-01-dashboards-as-code.md
    prompt: "How do the CUE SDK and the Go SDK differ in the dashboard they produce?"
    options:
      - id: a
        text: "The CUE SDK produces YAML and the Go SDK produces JSON that Perses cannot read."
        explanation: "Not correct. Both produce Perses resources."
      - id: b
        text: "Only the Go SDK can create panel groups."
        explanation: "Not correct. Both SDKs build panel groups."
      - id: c
        text: "Only the CUE SDK can be applied with `percli apply`."
        explanation: "Not correct. Built Go dashboards are applied the same way."
      - id: d
        text: "They produce the same Perses JSON. Only the way you write it differs."
        explanation: "Correct. A repository can hold CUE files and Go programs side by side."
    correct_option: d
    explanation: "Correct. A repository can hold CUE files and Go programs side by side."

  - id: ats108-010-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Know what percli dac build runs for a CUE file"
    source_readings:
      - sections/section-010/module-01/course-01-dashboards-as-code.md
    prompt: "What does `percli dac build` run for a `.cue` dashboard file?"
    options:
      - id: a
        text: "`go run <file> --output json`"
        explanation: "Not correct. That command is what the build runs for a Go file."
      - id: b
        text: "`kubectl apply -f <file>`"
        explanation: "Not correct. The build does not talk to the cluster."
      - id: c
        text: "`cue eval <file> --out json --concrete`"
        explanation: "Correct. The `--concrete` flag fails the build if a value is still undecided."
      - id: d
        text: "`cue vet <file>` without any output"
        explanation: "Not correct. The build needs the JSON output, so it uses `cue eval`."
    correct_option: c
    explanation: "Correct. The `--concrete` flag fails the build if a value is still undecided."

  - id: ats108-010-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Place the files of a DaC repository"
    source_readings:
      - sections/section-010/module-01/course-02-repository-and-build.md
    prompt: "Where does the repository put one Go dashboard?"
    options:
      - id: a
        text: "In `lib/boards/`, together with the shared functions."
        explanation: "Not correct. `lib/boards/` holds shared functions and their tests."
      - id: b
        text: "In its own folder, as `dashboards/go/<name>/main.go`."
        explanation: "Correct. Each Go dashboard needs its own folder."
      - id: c
        text: "In `cue.mod/`, next to the module file."
        explanation: "Not correct. `cue.mod/` holds the CUE module and its dependencies."
      - id: d
        text: "In `built/`, as a `.go` file."
        explanation: "Not correct. `built/` holds results of the build, not source."
    correct_option: b
    explanation: "Correct. Each Go dashboard needs its own folder."

  - id: ats108-010-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the output of a build"
    source_readings:
      - sections/section-010/module-01/course-02-repository-and-build.md
    prompt: "Where does `percli dac build -f dashboards/cue/prometheus-overview.cue -ojson` write its result?"
    options:
      - id: a
        text: "To `built/dashboards/cue/prometheus-overview_output.json`."
        explanation: "Correct. The name is the source path with `_output` and the format added, under `built`."
      - id: b
        text: "To `dashboards/cue/prometheus-overview.json`, next to the source."
        explanation: "Not correct. Results go under `built`, not next to the source."
      - id: c
        text: "To the Perses server, as a new dashboard."
        explanation: "Not correct. The build only writes a file. `percli apply` sends it."
      - id: d
        text: "To `built/prometheus-overview.json` without the folders."
        explanation: "Not correct. The folders of the source path are kept."
    correct_option: a
    explanation: "Correct. The name is the source path with `_output` and the format added, under `built`."

  - id: ats108-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe building a whole folder"
    source_readings:
      - sections/section-010/module-01/course-02-repository-and-build.md
    prompt: "What does `percli dac build -d dashboards` do when one dashboard file fails?"
    options:
      - id: a
        text: "It stops at the first failure and builds nothing else."
        explanation: "Not correct. It continues with the other files."
      - id: b
        text: "It skips the failing file and exits successfully."
        explanation: "Not correct. The exit code is an error, so a pipeline can stop."
      - id: c
        text: "It applies the good files to the server."
        explanation: "Not correct. Building never applies anything."
      - id: d
        text: "It builds the other files, lists the failures at the end and exits with an error."
        explanation: "Correct. One broken file does not hide the results of the others, but the command still fails."
    correct_option: d
    explanation: "Correct. One broken file does not hide the results of the others, but the command still fails."

  - id: ats108-010-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Recognise why a build shows old content"
    source_readings:
      - sections/section-010/module-01/course-02-repository-and-build.md
    prompt: "You changed a dashboard on your machine and ran the build in the runner, but the output is the old dashboard. What is the most likely cause?"
    options:
      - id: a
        text: "The `built` folder is committed and wins over the source."
        explanation: "Not correct. `built` is ignored by Git."
      - id: b
        text: "`--concrete` keeps the first build in a cache."
        explanation: "Not correct. `--concrete` only requires decided values."
      - id: c
        text: "You did not push the change. The runner builds `main` on Gitea."
        explanation: "Correct. The runner resets its copy to `main` before every command."
      - id: d
        text: "`percli dac build` only reads dashboards that already exist on the server."
        explanation: "Not correct. The build reads source files only."
    correct_option: c
    explanation: "Correct. The runner resets its copy to `main` before every command."

  - id: ats108-010-q09
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what percli apply does"
    source_readings:
      - sections/section-010/module-01/course-03-applying-and-diffing.md
    prompt: "What does `percli apply` do with a built dashboard file?"
    options:
      - id: a
        text: "It only updates existing dashboards and fails on new ones."
        explanation: "Not correct. It creates new resources as well."
      - id: b
        text: "It creates the dashboard on the server if it does not exist and updates it if it does."
        explanation: "Correct. It takes the project from the dashboard's `metadata.project`."
      - id: c
        text: "It builds the source file again and then compares it."
        explanation: "Not correct. Building is a separate command."
      - id: d
        text: "It deletes dashboards on the server that are not in the file."
        explanation: "Not correct. `percli apply` never deletes."
    correct_option: b
    explanation: "Correct. It takes the project from the dashboard's `metadata.project`."

  - id: ats108-010-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Define drift and find it"
    source_readings:
      - sections/section-010/module-01/course-03-applying-and-diffing.md
    prompt: "Which command shows drift between the code and the server, and what does it compare?"
    options:
      - id: a
        text: "`percli dac diff` compares the `spec` of each built dashboard with the dashboard of the same name on the server."
        explanation: "Correct. Any line in the diff is a difference between the code and the server."
      - id: b
        text: "`percli get dashboards` compares the list of names only."
        explanation: "Not correct. It lists dashboards and shows no differences."
      - id: c
        text: "`percli apply --dry-run` compares the Git history with the server."
        explanation: "Not correct. The diff command compares built files with the server."
      - id: d
        text: "`percli dac build -m stdout` compares two builds with each other."
        explanation: "Not correct. That flag only prints the built dashboard."
    correct_option: a
    explanation: "Correct. Any line in the diff is a difference between the code and the server."

  - id: ats108-010-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the kind of a built dashboard"
    source_readings:
      - sections/section-010/module-01/course-04-reading-a-built-dashboard.md
    prompt: "Which top-level fields does a built dashboard have?"
    options:
      - id: a
        text: "`name`, `panels` and `layouts` only."
        explanation: "Not correct. The panels and layouts are inside the spec, not at the top level."
      - id: b
        text: "`project`, `variables` and `duration` only."
        explanation: "Not correct. These are inside the metadata or the spec."
      - id: c
        text: "`datasource`, `query` and `plugin` only."
        explanation: "Not correct. These belong to a panel."
      - id: d
        text: "`kind`, `metadata` and `spec`."
        explanation: "Correct. The kind tells the server the resource type, the metadata holds the name and project, and the spec holds everything the dashboard shows."
    correct_option: d
    explanation: "Correct. The kind tells the server the resource type, the metadata holds the name and project, and the spec holds everything the dashboard shows."

  - id: ats108-010-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how panels get a position"
    source_readings:
      - sections/section-010/module-01/course-04-reading-a-built-dashboard.md
    prompt: "Where does a built dashboard store the position and size of a panel?"
    options:
      - id: a
        text: "In an item of a layout, which refers to the panel by its key."
        explanation: "Correct. A layout item has the fields x, y, width and height and a reference to the panel key."
      - id: b
        text: "In the panel's own `spec`."
        explanation: "Not correct. A panel describes what it is, not where it is."
      - id: c
        text: "In the `metadata` of the dashboard."
        explanation: "Not correct. The metadata holds the name and the project."
      - id: d
        text: "In the plugin options of the chart."
        explanation: "Not correct. The plugin options hold chart settings such as the calculation."
    correct_option: a
    explanation: "Correct. A layout item has the fields x, y, width and height and a reference to the panel key."

  - id: ats108-010-q13
    type: single_choice
    difficulty: beginner
    learning_objective: "Prepare a CUE module"
    source_readings:
      - sections/section-010/module-02/course-01-setting-up-a-cue-repository.md
    prompt: "What must exist before `percli dac setup` can prepare a CUE repository?"
    options:
      - id: a
        text: "A running Perses server."
        explanation: "Not correct. With `--version` the command works without a server."
      - id: b
        text: "A `cue.mod` folder created by `cue mod init`."
        explanation: "Correct. The setup command needs the CUE module, then writes an example file and runs `cue mod tidy`."
      - id: c
        text: "A `built` folder."
        explanation: "Not correct. The build creates this folder."
      - id: d
        text: "A Go module file."
        explanation: "Not correct. Go modules are for the Go SDK."
    correct_option: b
    explanation: "Correct. The setup command needs the CUE module, then writes an example file and runs `cue mod tidy`."

  - id: ats108-010-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Prepare a Go module"
    source_readings:
      - sections/section-010/module-02/course-02-setting-up-a-go-repository.md
    prompt: "What does `percli dac setup --language go` need in the folder?"
    options:
      - id: a
        text: "A `cue.mod` folder."
        explanation: "Not correct. That is for the CUE SDK."
      - id: b
        text: "A file called `built`."
        explanation: "Not correct. The build creates the folder."
      - id: c
        text: "A `go.mod` file."
        explanation: "Correct. It writes `main.go` and fetches the Perses Go module at the chosen version."
      - id: d
        text: "A running pipeline Job."
        explanation: "Not correct. Setup does not use a pipeline."
    correct_option: c
    explanation: "Correct. It writes `main.go` and fetches the Perses Go module at the chosen version."

  - id: ats108-010-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose between the file and folder build"
    source_readings:
      - sections/section-010/module-02/course-03-controlling-the-build.md
    prompt: "What does `percli dac build -d dashboards -ojson` do that `-f` does not?"
    options:
      - id: a
        text: "It merges all CUE files into one dashboard."
        explanation: "Not correct. Each CUE file is evaluated on its own."
      - id: b
        text: "It applies the dashboards to the server."
        explanation: "Not correct. Building never applies."
      - id: c
        text: "It only builds Go files."
        explanation: "Not correct. It builds CUE files and Go programs."
      - id: d
        text: "It builds every dashboard file in the folder, each CUE file on its own."
        explanation: "Correct. The folder build walks the folder and builds each CUE file and each Go program of package main."
    correct_option: d
    explanation: "Correct. The folder build walks the folder and builds each CUE file and each Go program of package main."

  - id: ats108-010-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the output path"
    source_readings:
      - sections/section-010/module-02/course-03-controlling-the-build.md
    prompt: "Where does the build write the result of `dashboards/cue/prometheus-overview.cue` in JSON?"
    options:
      - id: a
        text: "`built/dashboards/cue/prometheus-overview_output.json`"
        explanation: "Correct. The output path is the source path without its extension, placed in `built` with the suffix `_output` and the format."
      - id: b
        text: "`dashboards/cue/prometheus-overview.json`"
        explanation: "Not correct. The result goes to the `built` folder."
      - id: c
        text: "`built/prometheus-overview.json`"
        explanation: "Not correct. The path keeps the source folders."
      - id: d
        text: "Standard output only."
        explanation: "Not correct. That happens only with `-m stdout`."
    correct_option: a
    explanation: "Correct. The output path is the source path without its extension, placed in `built` with the suffix `_output` and the format."

  - id: ats108-010-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use stdout output"
    source_readings:
      - sections/section-010/module-02/course-03-controlling-the-build.md
    prompt: "Why use `-m stdout` when you inspect a build?"
    options:
      - id: a
        text: "It applies the result to the server."
        explanation: "Not correct. It never contacts the server."
      - id: b
        text: "It prints the result instead of writing a file, so you can pipe it to `jq`."
        explanation: "Correct. The mode prints the built dashboard so you can read it without changing files."
      - id: c
        text: "It makes the build faster by skipping CUE."
        explanation: "Not correct. It evaluates the same file."
      - id: d
        text: "It is required for Go programs."
        explanation: "Not correct. Go programs also write to the built folder by default."
    correct_option: b
    explanation: "Correct. The mode prints the built dashboard so you can read it without changing files."

  - id: ats108-010-q18
    type: single_choice
    difficulty: beginner
    learning_objective: "Find the project a dashboard names"
    source_readings:
      - sections/section-010/module-02/course-04-projects-and-apply.md
    prompt: "Where does a dashboard's project come from when you apply it?"
    options:
      - id: a
        text: "From the name of the Git repository."
        explanation: "Not correct. The repository name is not used."
      - id: b
        text: "From the first project on the server."
        explanation: "Not correct. The resource names its own project."
      - id: c
        text: "From `metadata.project` in the built resource."
        explanation: "Correct. The built resource names its project, and `percli apply` sends it there."
      - id: d
        text: "From the Kubernetes namespace."
        explanation: "Not correct. Perses projects are not namespaces."
    correct_option: c
    explanation: "Correct. The built resource names its project, and `percli apply` sends it there."

  - id: ats108-010-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Handle a project mismatch"
    source_readings:
      - sections/section-010/module-02/course-04-projects-and-apply.md
    prompt: "A dashboard names a project that does not exist. What is the correct fix for a dashboard that belongs in `inventory`?"
    options:
      - id: a
        text: "Apply with `--force`."
        explanation: "Not correct. The source would still name the wrong project."
      - id: b
        text: "Create the missing project with `--create-project`."
        explanation: "Not correct. That makes the wrong project permanent."
      - id: c
        text: "Edit the dashboard in the browser."
        explanation: "Not correct. The code would then differ from the server."
      - id: d
        text: "Change the project in the source, commit, build and apply."
        explanation: "Correct. The fix belongs in the code, so the next build and apply produce the right result."
    correct_option: d
    explanation: "Correct. The fix belongs in the code, so the next build and apply produce the right result."

  - id: ats108-010-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Verify the destination"
    source_readings:
      - sections/section-010/module-02/course-04-projects-and-apply.md
    prompt: "How do you check which dashboards a project holds?"
    options:
      - id: a
        text: "List them through the API path of that project."
        explanation: "Correct. The API path contains the project, so the list shows only that project's dashboards."
      - id: b
        text: "Read the `built` folder."
        explanation: "Not correct. It shows what was built, not what the server holds."
      - id: c
        text: "Run `git log`."
        explanation: "Not correct. The log shows commits."
      - id: d
        text: "Read the CronJob."
        explanation: "Not correct. The CronJob holds the pipeline."
    correct_option: a
    explanation: "Correct. The API path contains the project, so the list shows only that project's dashboards."

