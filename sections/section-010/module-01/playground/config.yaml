# Build And Apply Your First Dashboard As Code (PLAYGROUND) — Playground environment
# A sandbox: it spins up, prepares the environment, then stays running for
# free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-108-playground-010-01"
  docs:
    guide: "docs/overview.md"
bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm, Perses, Prometheus, Gitea and the DaC runner, then push the starting state of gitops/dashboards."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus, the tester pod, Gitea and the DaC runner."
      type: "file"
      source: "manifests/lab-start.yaml"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/persesdev/perses:v0.54.0
      - gitea/gitea:28.2.0-rootless
      - golang:1.26.5-alpine
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
