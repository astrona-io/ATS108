# Write Dashboards In Go (PLAYGROUND) — Playground environment
# A sandbox: it spins up, prepares the environment, then stays running for
# free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-108-playground-030-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm, Perses, Prometheus, Gitea and the DaC runner, then push the starting state of gitops/dashboards."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Prometheus, the tester pod, Gitea and the DaC runner."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
