# Course manifest for ATS108 - Dashboard-as-Code With CUE & Go (Perses).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS108
  title: "Perses: Dashboard-as-Code With CUE & Go"
  maturity: draft
  description: >
    Training material covering the Dashboard-as-Code domain of the Perses
    training path: why dashboards belong in Git, setting up a repository and
    building it with percli dac, writing dashboards with the Perses CUE SDK
    and reusable CUE definitions, writing them with the Perses Go SDK and
    testing the shared code, and a pipeline that lints, builds, diffs and
    applies dashboards and refuses broken ones. Each module pairs a layered
    reader with an ungraded hands-on playground and a graded practice lab.
    Each section closes with an integration capstone.
    Written for Perses v0.54.0, CUE v0.17.1 and Go 1.26.5.

  certification:
    name: Perses
    code: PERSES
    provider: Astrona
    domain: Dashboard-as-Code With CUE & Go
    weight: 25

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Why Dashboard-As-Code"
    description: >
      Dashboards as files in Git instead of clicks in a browser, the CUE and
      Go SDKs compared, the repository layout percli dac expects, building
      dashboards into the built folder, and applying, diffing and previewing
      them against a Perses server.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Build And Apply Your First Dashboard As Code"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Dashboards As Code"
        path: sections/section-010/module-01/course-01-dashboards-as-code.md
      - type: reading
        title: "The Repository And The Build"
        path: sections/section-010/module-01/course-02-repository-and-build.md
      - type: reading
        title: "Applying And Diffing Built Dashboards"
        path: sections/section-010/module-01/course-03-applying-and-diffing.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Build And Apply A CUE Dashboard Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 15m
        topic: dac-workflow
        task_kind: build
        tags: [percli-dac-build, percli-apply, built-folder, cue-sdk, git-workflow]
        learning_goals:
          - Build a CUE dashboard into JSON with percli dac build
          - Apply the built dashboard to the right Perses project
          - Prove that the dashboard on the server is exactly what the code builds
        resources:
          - name: "Getting started with Dashboard-as-Code"
            url: https://perses.dev/perses/docs/dac/getting-started/
          - name: "Dashboard-as-Code concept"
            url: https://perses.dev/perses/docs/concepts/dashboard-as-code/
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Bring A Hand-Edited Dashboard Back Under Code Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: dac-workflow
        task_kind: migration
        tags: [percli-dac-diff, drift, percli-apply, cue-sdk, git-workflow]
        learning_goals:
          - Find the changes made to a dashboard in the browser with percli dac diff
          - Move the change worth keeping into the code and push it
          - Prove that the server holds exactly what the code at the head of main builds
        resources:
