        path: sections/section-020/module-01/course-03-shared-definitions-and-validation.md
      - type: reading
        title: Question
        path: sections/section-020/module-01/labs/lab-01/question.md
      - type: lab
        title: "Compose A Dashboard From Shared Panels Lab"
        path: sections/section-020/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: cue
        task_kind: build
        tags: [cue-sdk, cue-definitions, cue-packages, panel-groups, list-variable, percli-dac-build]
        learning_goals:
          - Write a CUE dashboard that uses only panels from a shared package
          - Group panels and add a label values variable with the Perses builders
          - Prove the result with a build and the dashboard on the server
        resources:
          - name: "CUE SDK"
            url: https://perses.dev/perses/docs/dac/cue/
          - name: "CUE: modules, packages and instances"
