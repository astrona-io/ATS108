            url: https://perses.dev/perses/docs/dac/getting-started/
          - name: "percli"
            url: https://perses.dev/perses/docs/cli/

  - id: module-020
    title: "CUE For Dashboards"
    description: >
      The CUE language as far as dashboards need it: values, types,
      constraints, unification, defaults, definitions, packages and modules;
      the Perses CUE builders for dashboards, panel groups and variables;
      and shared definitions that keep dashboards short and catch errors at
      build time.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-020/README.md

      - type: reading
        title: "Write Dashboards In CUE"
        path: sections/section-020/module-01/course.md
      - type: reading
        title: "CUE Essentials For Dashboards"
        path: sections/section-020/module-01/course-01-cue-essentials.md
      - type: reading
